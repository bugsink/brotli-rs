name: Merge green Dependabot PRs

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  actions: write
  contents: write
  pull-requests: write

jobs:
  merge:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Verify and merge the tested Dependabot PR
        uses: actions/github-script@v9
        with:
          script: |
            const run = context.payload.workflow_run;
            if (run.pull_requests.length !== 1) {
              core.notice(
                `Expected one pull request for CI run ${run.id}; found ` +
                run.pull_requests.length
              );
              return;
            }

            const pullNumber = run.pull_requests[0].number;
            const {data: pull} = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pullNumber,
            });
            const expectedRepository = `${context.repo.owner}/${context.repo.repo}`;
            if (
              pull.state !== "open" ||
              pull.user.login !== "dependabot[bot]" ||
              pull.base.ref !== "main" ||
              pull.head.repo?.full_name !== expectedRepository ||
              pull.head.sha !== run.head_sha
            ) {
              core.notice(
                `CI run ${run.id} does not match an open, tested ` +
                `Dependabot PR; refusing to merge #${pullNumber}`
              );
              return;
            }

            const {data: result} = await github.rest.pulls.merge({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pullNumber,
              merge_method: "squash",
              sha: run.head_sha,
            });
            if (!result.merged) {
              core.setFailed(`GitHub did not merge #${pullNumber}: ${result.message}`);
              return;
            }

            // A merge made with GITHUB_TOKEN does not emit a push workflow.
            // Dispatch CI so the exact new main commit is tested and can feed
            // the automatic dependency-release workflow.
            await github.request(
              "POST /repos/{owner}/{repo}/actions/workflows/{workflow_id}/dispatches",
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: "ci.yml",
                ref: "main",
                headers: {
                  "X-GitHub-Api-Version": "2026-03-10",
                },
              }
            );
