name: Automatic Release Check

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:
    inputs:
      previous_commit:
        description: Commit to compare with HEAD
        required: true
        type: string

permissions:
  actions: write
  contents: write

concurrency:
  group: automatic-dependency-release
  cancel-in-progress: false

jobs:
  check:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Prepare release
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          PREVIOUS_COMMIT: ${{ inputs.previous_commit }}
          GH_TOKEN: ${{ github.token }}
        run: |
          previous_commit="$PREVIOUS_COMMIT"
          if [ -z "$previous_commit" ]; then
            previous_commit="$(git rev-parse "$HEAD_SHA^")"
          fi
          python scripts/automatic_release.py "$previous_commit"
