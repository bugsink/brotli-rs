name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
          - os: ubuntu-latest
            python: "3.12"
          - os: ubuntu-latest
            python: "3.13"
          - os: ubuntu-latest
            python: "3.14"
          - os: ubuntu-latest
            python: "3.15"
          - os: macos-latest
            python: "3.12"
          - os: windows-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Install test tools
        run: |
          python -m pip install maturin pytest hypothesis
          python - <<'PY'
          import subprocess
          import tomllib

          dependencies = tomllib.load(open("pyproject.toml", "rb"))[
              "project"
          ]["optional-dependencies"]["test"]
          oracle = next(item for item in dependencies if item.startswith("Brotli"))
          subprocess.run(["python", "-m", "pip", "install", oracle], check=True)
          PY
      - name: Build wheel
        run: maturin build --release --locked --out dist
      - name: Install wheel
        run: python -m pip install --no-index --find-links=dist --force-reinstall brotli-rs
      - name: Test
        run: pytest

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings

  minimum-rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.85
      - run: cargo check --locked

