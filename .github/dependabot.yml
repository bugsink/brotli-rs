version: 2

updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      rust-brotli:
        patterns:
          - brotli
          - brotli-decompressor

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      google-brotli-oracle:
        patterns:
          - Brotli

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
