version: 2

updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      rust-brotli:
        patterns:
          - brotli
          - brotli-decompressor
      other-rust:
        patterns:
          - "*"
        exclude-patterns:
          - brotli
          - brotli-decompressor

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      google-brotli-oracle:
        patterns:
          - Brotli
      other-python:
        patterns:
          - "*"
        exclude-patterns:
          - Brotli

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    ignore:
      # This action reference is also the toolchain version in the MSRV job.
      - dependency-name: dtolnay/rust-toolchain
    groups:
      all-actions:
        patterns:
          - "*"
