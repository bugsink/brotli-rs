[package]
name = "brotli-rs-python"
version = "9.1.1"
edition = "2021"
rust-version = "1.85"
license = "MIT"
description = "Python bindings for the safe-Rust brotli crate"
repository = "https://github.com/bugsink/brotli-rs"
homepage = "https://github.com/bugsink/brotli-rs"
readme = "README.md"
publish = false

[lib]
name = "_brotli_rs"
crate-type = ["cdylib"]

[dependencies]
# Keep encoder output independent of the target's float implementation:
# https://github.com/dropbox/rust-brotli/issues/271
# https://github.com/dropbox/rust-brotli/pull/259
brotli = { version = "=9.1.1", features = ["portable-float"] }
brotli-decompressor = "=6.2.0"
pyo3 = { version = "0.30.1", features = ["abi3-py311", "extension-module"] }

