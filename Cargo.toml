[package]
name = "brotli-rs-python"
version = "3.3.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
description = "Python bindings for the safe-Rust brotli crate"
repository = "https://github.com/bugsink/brotli-rs"
homepage = "https://github.com/bugsink/brotli-rs"
readme = "README.md"
publish = false

[lib]
name = "_brotli_rs"
crate-type = ["cdylib"]

[dependencies]
brotli = "=3.3.0"
brotli-decompressor = "=2.3.0"
pyo3 = { version = "0.30.1", features = ["abi3-py311", "extension-module"] }
